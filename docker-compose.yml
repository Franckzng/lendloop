services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Secrets and settings live in .env.n8n (not committed).
    # Copy .env.n8n.example to .env.n8n and fill it in.
    env_file:
      - .env.n8n
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
